<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗿</text></svg>">
    <title>Meine Projekte</title>
    <style>
      * { box-sizing: border-box; }

      body {
        background-color: #0d0d0d;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px 50px 50px 50px;
        transition: background 0.8s ease;
        min-height: 100vh;
        margin: 0;
        opacity: 0;
        animation: fadeIn 1s ease forwards;
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      body::after {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        opacity: 0.15;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 200px 200px;
      }

      h1 {
        color: white;
        font-size: 3em;
        min-height: 1.2em;
      }

      p { font-size: 1.2em; color: #a8a8b3; }

      nav { margin-bottom: 8px; }
      nav a {
        color: white;
        text-decoration: none;
        margin: 0 20px;
        font-size: 1.2em;
      }
      nav a:hover { text-decoration: underline; }

      .header-shape {
        width: 250px;
        height: 20px;
        background-color: rgba(255, 255, 255, 0.15);
        border: none;
        border-radius: 20px;
        margin: 0 auto 10px auto;
        transition: transform 0.3s ease;
      }

      .header-shape:hover {
        transform: scale(1.4);
      }

      /* Grid Layout */
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        max-width: 1000px;
        margin: 0 auto;
      }

      .project-card {
        background-color: rgba(22, 33, 62, 0.8);
        border: 1px solid white;
        border-radius: 10px;
        padding: 30px;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        backdrop-filter: blur(5px);
      }

      .project-card:hover {
        background-color: rgba(15, 52, 96, 0.8);
        transform: translateY(-10px);
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
      }

      .project-card h2 { color: white; }
      .project-card p { color: #a8a8b3; font-size: 1em; }

      /* Footer */
      footer {
        margin-top: 60px;
        color: #a8a8b3;
        font-size: 0.9em;
      }

      footer a {
        color: white;
        text-decoration: none;
      }

      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">Über mich</a>
    </nav>

    <div class="header-shape"></div>

    <h1 id="title"></h1>
    <p>Hier sind meine bisherigen Projekte:</p>

    <div class="projects-grid">
      <div class="project-card" onclick="window.open('projects/qlearning.html', '_blank')">
        <h2>Q-Learning</h2>
        <p>Ein interaktives Q-Learning Programm – schau rein und probier es aus!</p>
      </div>
    </div>

    <footer>
      <p>Gemacht von <a href="https://github.com/notRichtiger" target="_blank">notRichtiger</a> · GitHub</p>
    </footer>

    <script>
      // Typing Effekt
      const text = "Meine Projekte";
      let i = 0;
      function type() {
        if (i < text.length) {
          document.getElementById('title').textContent += text[i];
          i++;
          setTimeout(type, 80);
        }
      }
      setTimeout(type, 500);

      // Mouse Tracker
      const zones = [
        { x: 0,   y: 0,   color: '120, 40, 200' },
        { x: 100, y: 0,   color: '40, 180, 120' },
        { x: 50,  y: 100, color: '20, 80, 200' },
      ];

      function getZoneColor(mx, my) {
        let closestZone = zones[0];
        let closestDist = Infinity;

        zones.forEach(zone => {
          const dist = Math.sqrt(
            Math.pow(mx - zone.x, 2) + Math.pow(my - zone.y, 2)
          );
          if (dist < closestDist) {
            closestDist = dist;
            closestZone = zone;
          }
        });

        return closestZone.color;
      }

      document.addEventListener('mousemove', function(e) {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        const color = getZoneColor(x, y);
        document.body.style.background = `
          radial-gradient(circle at ${x}% ${y}%, 
            rgba(${color}, 0.4) 0%, 
            #0d0d0d 30%)
        `;
      });
    </script>
  </body>
</html>
