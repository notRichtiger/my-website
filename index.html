<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>Meine Projekte</title>
    <style>
      body {
        background-color: #1a1a2e;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 50px;
        transition: background 0.1s ease;
        min-height: 100vh;
      margin: 0;
      }

      h1 { color: #e94560; font-size: 3em; }
      p { font-size: 1.2em; color: #a8a8b3; }

      nav { margin-bottom: 40px; }
      nav a {
        color: #e94560;
        text-decoration: none;
        margin: 0 20px;
        font-size: 1.2em;
      }
      nav a:hover { text-decoration: underline; }

      .project-card {
        background-color: #16213e;
        border: 1px solid #e94560;
        border-radius: 10px;
        padding: 30px;
        width: 300px;
        margin: 20px auto;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .project-card:hover {
        background-color: #0f3460;
        transform: translateY(-10px);
        box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
      }

      .project-card h2 { color: #e94560; }
      .project-card p { color: #a8a8b3; font-size: 1em; }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">Über mich</a>
    </nav>

    <h1>Meine Projekte</h1>
    <p>Hier sind meine bisherigen Projekte:</p>

    <div class="project-card" onclick="window.open('projects/qlearning.html', '_blank')">
      <h2>Q-Learning</h2>
      <p>Ein interaktives Q-Learning Programm – schau rein und probier es aus!</p>
    </div>

    <script>
      document.addEventListener('mousemove', function(e) {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        document.body.style.background = `radial-gradient(circle at ${x}% ${y}%, #0f3460, #1a1a2e)`;
      });
    </script>
  </body>
</html>
