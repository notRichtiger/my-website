<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>Meine Projekte</title>
    <style>
      body {
        background-color: #0d0d0d;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 50px;
        transition: background 0.8s ease;
        min-height: 100vh;
        margin: 0;
      }

      /* Grain Overlay */
      body::after {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        opacity: 0.15;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 200px 200px;
      }

      h1 { color: #e94560; font-size: 3em; }
      p { font-size: 1.2em; color: #a8a8b3; }

      nav { margin-bottom: 40px; }
      nav a {
        color: #e94560;
        text-decoration: none;
        margin: 0 20px;
        font-size: 1.2em;
      }
      nav a:hover { text-decoration: underline; }

      .project-card {
        background-color: rgba(22, 33, 62, 0.8);
        border: 1px solid #e94560;
        border-radius: 10px;
        padding: 30px;
        width: 300px;
        margin: 20px auto;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        backdrop-filter: blur(5px);
      }

      .project-card:hover {
        background-color: rgba(15, 52, 96, 0.8);
        transform: translateY(-10px);
        box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
      }

      .project-card h2 { color: #e94560; }
      .project-card p { color: #a8a8b3; font-size: 1em; }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">Über mich</a>
    </nav>

    <h1>Meine Projekte</h1>
    <p>Hier sind meine bisherigen Projekte:</p>

    <div class="project-card" onclick="window.open('projects/qlearning.html', '_blank')">
      <h2>Q-Learning</h2>
      <p>Ein interaktives Q-Learning Programm – schau rein und probier es aus!</p>
    </div>

    <script>
      const zones = [
        { x: 0,   y: 0,   color: '120, 40, 200' },
        { x: 100, y: 0,   color: '40, 180, 120' },
        { x: 50,  y: 100, color: '20, 80, 200' },
      ];

      function getZoneColor(mx, my) {
        let closestZone = zones[0];
        let closestDist = Infinity;

        zones.forEach(zone => {
          const dist = Math.sqrt(
            Math.pow(mx - zone.x, 2) + Math.pow(my - zone.y, 2)
          );
          if (dist < closestDist) {
            closestDist = dist;
            closestZone = zone;
          }
        });

        return closestZone.color;
      }

      document.addEventListener('mousemove', function(e) {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;

        const color = getZoneColor(x, y);

        document.body.style.background = `
        radial-gradient(circle at ${x}% ${y}%, 
        rgba(${color}, 0.4) 0%, 
        #0d0d0d 30%)
`;
        `;
      });
    </script>
  </body>
</html>
