<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗿</text></svg>">
  <title>My Projects</title>
  <style>
    /* ─── Variables ─────────────────────────────────────────── */
    :root {
      --bg:           #0d0d0d;
      --card-bg:      rgba(255, 255, 255, 0.04);
      --card-border:  rgba(255, 255, 255, 0.10);
      --card-hover:   rgba(255, 255, 255, 0.08);
      --text:         #ffffff;
      --text-muted:   rgba(255, 255, 255, 0.40);
      --accent:       rgba(120, 80, 255, 0.85);
      --accent-glow:  rgba(120, 80, 255, 0.18);
      --radius:       12px;
      --transition:   0.25s ease;
    }

    /* ─── Reset & Base ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 28px 40px 60px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    /* ─── Noise Overlay ─────────────────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px;
    }

    /* ─── Nav ───────────────────────────────────────────────── */
    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    nav a {
      display: inline-block;
      padding: 10px 26px;
      border-radius: 999px;
      font-size: 0.85em;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      text-decoration: none;
      background: #1e1e1e;
      color: var(--text);
      transition: background var(--transition), transform var(--transition);
    }

    nav a:hover {
      background: #2a2a2a;
      transform: scale(1.04);
    }

    nav a.active {
      background: #7a3fc0;
      color: #ffffff;
    }

    nav a.active:hover {
      background: #8f4fd6;
    }

    /* ─── Header ────────────────────────────────────────────── */
    h1 {
      font-size: clamp(2em, 5vw, 3em);
      font-weight: 500;
      letter-spacing: -0.02em;
      min-height: 1.3em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1em;
      margin-bottom: 40px;
    }

    /* ─── Project Grid ──────────────────────────────────────── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ─── Project Card ──────────────────────────────────────── */
    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: left;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), transform var(--transition);
    }

    .project-card:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-4px);
    }

    .project-card.disabled {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }

    .card-tag {
      font-size: 0.7em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .card-tag::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .card-tag.muted { color: var(--text-muted); }
    .card-tag.muted::before { background: var(--text-muted); }

    .project-card h2 {
      font-size: 1.05em;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.88em;
      line-height: 1.5;
    }

    /* ─── Footer ────────────────────────────────────────────── */
    footer {
      margin-top: 60px;
      color: var(--text-muted);
      font-size: 0.85em;
    }

    footer a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color var(--transition);
    }

    footer a:hover { color: var(--text); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="projects.html" class="active">Projects</a>
    <a href="about.html">About me</a>
  </nav>

  <h1 id="title"></h1>
  <p class="subtitle">Hier sind meine Projekte:</p>

  <div class="projects-grid">

    <div class="project-card" data-href="projects/qlearning.html">
      <div class="card-tag">Machine Learning</div>
      <h2>Q-Learning</h2>
      <p>Ein interaktives Q-Learning Programm</p>
    </div>

    <div class="project-card disabled">
      <div class="card-tag muted">Coming soon</div>
      <h2>Nächstes Projekt</h2>
      <p>Mehr kommt bald...</p>
    </div>

    <div class="project-card disabled">
      <div class="card-tag muted">Coming soon</div>
      <h2>Nächstes Projekt</h2>
      <p>Mehr kommt bald...</p>
    </div>

  </div>

  <footer>
    Made with love by <a href="https://github.com/notRichtiger" target="_blank">notRichtiger</a> · GitHub
  </footer>

  <script>
    // ─── Typing Effect ───────────────────────────────────────
    const titleText = "Meine Projekte";
    const titleEl = document.getElementById('title');
    let charIndex = 0;

    function typeNextChar() {
      if (charIndex < titleText.length) {
        titleEl.textContent += titleText[charIndex];
        charIndex++;
        setTimeout(typeNextChar, 80);
      }
    }

    setTimeout(typeNextChar, 400);

    // ─── Mouse Glow ──────────────────────────────────────────
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth)  * 100;
      const y = (e.clientY / window.innerHeight) * 100;

      // Shift hue slightly based on position for subtle variety
      const hue = Math.round(260 + (x - 50) * 0.4);

      document.body.style.background = `
        radial-gradient(circle at ${x}% ${y}%,
          hsla(${hue}, 70%, 55%, 0.15) 0%,
          var(--bg) 55%)
      `;
    });

    // ─── Card Click Handler ───────────────────────────────────
    document.querySelectorAll('.project-card[data-href]').forEach(card => {
      card.addEventListener('click', () => {
        window.open(card.dataset.href, '_blank');
      });
    });
  </script>

</body>
</html>
