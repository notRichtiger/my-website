<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗿</text></svg>">
  <title>Work in Progress</title>
  <style>
    /* ─── Variables ─────────────────────────────────────────── */
    :root {
      --bg:          #0d0d0d;
      --text:        #ffffff;
      --text-muted:  rgba(255, 255, 255, 0.40);
      --accent:      #7a3fc0;
      --accent-hover:#8f4fd6;
      --transition:  0.25s ease;
    }

    /* ─── Reset & Base ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    /* ─── Noise Overlay ─────────────────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px;
    }

    /* ─── Pixel Mole ────────────────────────────────────────── */
    .mole-wrap {
      image-rendering: pixelated;
      animation: mole-bob 2s ease-in-out infinite;
    }

    @keyframes mole-bob {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-8px); }
    }

    /* ─── Text ──────────────────────────────────────────────── */
    h1 {
      font-size: clamp(1.6em, 4vw, 2.4em);
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--text-muted);
      font-size: 1em;
    }

    /* ─── Back Button ───────────────────────────────────────── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 12px 28px;
      border-radius: 999px;
      background: #1e1e1e;
      color: var(--text);
      font-size: 0.9em;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.10);
      transition: background var(--transition), transform var(--transition),
                  box-shadow var(--transition), border-color var(--transition);
    }

    .back-btn:hover {
      background: var(--accent);
      border-color: var(--accent-hover);
      transform: scale(1.05);
      box-shadow: 0 0 24px rgba(122, 63, 192, 0.35);
    }

    .back-btn:active { transform: scale(1.01); }
  </style>
</head>
<body>

  <!-- Pixel Art Mole: 16x18 grid, each pixel = 10px -->
  <div class="mole-wrap">
    <svg width="160" height="200" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated">

      <!-- ─── Helm (gelb) ─────────────────────────────────── -->
      <rect x="4"  y="0"  width="8" height="1" fill="#f5c518"/>
      <rect x="3"  y="1"  width="10" height="1" fill="#f5c518"/>
      <rect x="3"  y="2"  width="10" height="1" fill="#f5c518"/>
      <rect x="3"  y="3"  width="10" height="1" fill="#d4a800"/>
      <!-- Helm-Rand -->
      <rect x="2"  y="3"  width="12" height="1" fill="#b38a00"/>

      <!-- ─── Gesicht (braun) ────────────────────────────── -->
      <rect x="4"  y="4"  width="8" height="1" fill="#8B5E3C"/>
      <rect x="3"  y="5"  width="10" height="3" fill="#8B5E3C"/>
      <!-- Schnauze (heller) -->
      <rect x="5"  y="6"  width="6" height="2" fill="#c49a6c"/>
      <!-- Augen (dunkel) -->
      <rect x="4"  y="5"  width="2" height="1" fill="#2a1a0a"/>
      <rect x="10" y="5"  width="2" height="1" fill="#2a1a0a"/>
      <!-- Augen-Glanz -->
      <rect x="4"  y="5"  width="1" height="1" fill="#ffffff"/>
      <rect x="10" y="5"  width="1" height="1" fill="#ffffff"/>
      <!-- Nase -->
      <rect x="7"  y="7"  width="2" height="1" fill="#7a3030"/>

      <!-- ─── Körper ──────────────────────────────────────── -->
      <rect x="3"  y="8"  width="10" height="5" fill="#6b4226"/>
      <!-- Bauch heller -->
      <rect x="5"  y="9"  width="6"  height="3" fill="#9c6b3c"/>

      <!-- ─── Arme ────────────────────────────────────────── -->
      <!-- Linker Arm -->
      <rect x="1"  y="9"  width="2" height="3" fill="#6b4226"/>
      <rect x="0"  y="11" width="2" height="1" fill="#c49a6c"/>
      <!-- Rechter Arm (hält Schaufel) -->
      <rect x="13" y="9"  width="2" height="3" fill="#6b4226"/>
      <rect x="14" y="11" width="2" height="1" fill="#c49a6c"/>

      <!-- ─── Schaufel ────────────────────────────────────── -->
      <!-- Stiel -->
      <rect x="14" y="8"  width="1" height="6" fill="#a0714f"/>
      <!-- Blatt -->
      <rect x="13" y="13" width="3" height="1" fill="#888"/>
      <rect x="13" y="14" width="3" height="1" fill="#aaa"/>
      <rect x="14" y="15" width="1" height="1" fill="#888"/>

      <!-- ─── Beine ───────────────────────────────────────── -->
      <rect x="5"  y="13" width="3" height="2" fill="#6b4226"/>
      <rect x="8"  y="13" width="3" height="2" fill="#6b4226"/>
      <!-- Füße -->
      <rect x="4"  y="15" width="3" height="1" fill="#4a2e15"/>
      <rect x="8"  y="15" width="3" height="1" fill="#4a2e15"/>

      <!-- ─── Erde unten ──────────────────────────────────── -->
      <rect x="0"  y="17" width="16" height="1" fill="#5c3d1e"/>
      <rect x="0"  y="18" width="16" height="1" fill="#4a2e15"/>
      <rect x="0"  y="19" width="16" height="1" fill="#3a2010"/>
      <!-- Erd-Klumpen -->
      <rect x="2"  y="16" width="2" height="1" fill="#5c3d1e"/>
      <rect x="11" y="16" width="3" height="1" fill="#5c3d1e"/>
      <rect x="6"  y="16" width="1" height="1" fill="#4a2e15"/>
    </svg>
  </div>

  <h1>Work in Progress</h1>
  <p>Diese Seite ist noch in Arbeit — komm bald wieder!</p>

  <a class="back-btn" href="index.html">
    ← Back to Home
  </a>

</body>
</html>
